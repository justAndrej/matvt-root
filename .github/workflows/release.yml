name: Build and publish APK
run-name: Release ${{ inputs.tag }} from ${{ inputs.source_branch }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to build (independent of "Use workflow from")'
        type: string
        required: true
        default: phone-port
      tag:
        description: 'New release tag, e.g. v1.1.0 or v1.1.0-rc.1'
        type: string
        required: true
      version_code:
        description: 'Android versionCode: increase for each release (first example: 102)'
        type: string
        required: true
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build unsigned release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERSION_CODE: ${{ inputs.version_code }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _ci
          persist-credentials: false

      - name: Check release tooling
        run: python3 -B _ci/.github/release/test_release.py

      - name: Validate release inputs
        id: version
        run: python3 -B _ci/.github/release/release.py validate

      - name: Check out the selected source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ inputs.source_branch }}
          path: source
          persist-credentials: false

      - name: Record the exact source commit
        id: source
        run: printf 'sha=%s\n' "$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Use an isolated SDK for the phone build
        run: |
          mkdir -p "$RUNNER_TEMP/matvt-sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "$RUNNER_TEMP/matvt-sdk" "$RUNNER_TEMP/matvt-sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK 29 and Build Tools 30.0.3
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-29 build-tools;30.0.3'
          log-accepted-android-sdk-licenses: false

      - name: Set up Java 11 for Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: |
            source/**/*.gradle
            source/gradle/wrapper/gradle-wrapper.properties
            _ci/.github/release/version.gradle

      - name: Run tests and build release APK
        working-directory: source
        env:
          MATVT_RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          MATVT_RELEASE_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          bash ./gradlew --no-daemon --console=plain \
            --init-script "$GITHUB_WORKSPACE/_ci/.github/release/version.gradle" \
            :app:testDebugUnitTest :app:assembleRelease

      - name: Verify build metadata and stage the APK
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 -B _ci/.github/release/release.py stage source unsigned

      - name: Upload unsigned build for the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: unsigned/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Sign and publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _ci
          persist-credentials: false

      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 -B _ci/.github/release/release.py check-signing

      - name: Download the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Use an isolated signing SDK
        run: |
          mkdir -p "$RUNNER_TEMP/matvt-sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "$RUNNER_TEMP/matvt-sdk" "$RUNNER_TEMP/matvt-sdk" >> "$GITHUB_ENV"

      - name: Install APK signing tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'build-tools;30.0.3'
          log-accepted-android-sdk-licenses: false

      - name: Set up Java 11 for APK signing
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Sign with the stored Android Studio key and verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 -B _ci/.github/release/release.py sign unsigned release

      - name: Save signed release files as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk-${{ inputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Publish the release at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: python3 -B _ci/.github/release/release.py publish release
